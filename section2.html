<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="section2.css">
</head>
<body>
    <section class="section2">
        <div class="container">
          <div class="left-box">
            <img src="assets/aboutme.jpg" alt="일러스트" />
            <p class="desc">Simple design, strong logic.<br />I create with both.</p>
          </div>
          <div class="right-box">
            <div class="skill">
              <img src="assets/ai.svg" alt="Illustrator">
              <div class="text">
                <strong>Illustrator</strong>
                <p>아이콘, 편집 디자인 작업에 능숙해요.</p>
              </div>
            </div>
            <div class="skill">
              <img src="assets/ps.svg" alt="Photoshop">
              <div class="text">
                <strong>Photoshop</strong>
                <p>이미지 리터칭 및 합성에 강해요.</p>
              </div>
            </div>
            <div class="skill">
              <img src="assets/Figma.svg" alt="Figma">
              <div class="text">
                <strong>Figma</strong>
                <p>프로토타이핑과 편디자인 제작에 사용해요.</p>
              </div>
            </div>
            <div class="skill">
              <img src="assets/html.svg" alt="HTML">
              <div class="text">
                <strong>HTML</strong>
                <p>웹 표준을 지켜 정보 구조를 깔끔하게 설계합니다.</p>
              </div>
            </div>
            <div class="skill">
              <img src="assets/css.svg" alt="CSS">
              <div class="text">
                <strong>CSS</strong>
                <p>브랜드 무드를 담은 감각적인 스타일을 구현합니다.</p>
              </div>
            </div>
          </div>
        </div>
      </section>

</html>
